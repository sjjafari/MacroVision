name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: macrovision
          POSTGRES_PASSWORD: macrovision
          POSTGRES_DB: macrovision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macrovision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - name: Build package and smoke-test installed wheel on SQLite
        run: |
          python -m build
          python -m venv /tmp/macrovision-wheel
          /tmp/macrovision-wheel/bin/pip install "$(ls dist/*.whl)[postgres]"
          /tmp/macrovision-wheel/bin/python scripts/release_smoke.py \
            --database-url sqlite:////tmp/macrovision-wheel-smoke.db
      - name: SQLite migration cycle
        env:
          MACROVISION_DATABASE_URL: sqlite:////tmp/macrovision-ci.db
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL migration cycle
        env:
          MACROVISION_DATABASE_URL: postgresql+psycopg://macrovision:macrovision@localhost:5432/macrovision
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          python - <<'PY'
          import os
          import psycopg

          owned = {
              "risktolerance",
              "journalstatus",
              "transactiontype",
              "decisionstatus",
              "evidencesourcetype",
              "revisionevent",
              "seriescategory",
              "datafrequency",
              "seasonaladjustment",
              "observationstatus",
              "importstatus",
              "qualityissuetype",
              "qualityissuestatus",
          }
          with psycopg.connect(os.environ["MACROVISION_DATABASE_URL"].replace("+psycopg", "")) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT typname FROM pg_type WHERE typname = ANY(%s)",
                      (list(owned),),
                  )
                  remaining = {row[0] for row in cursor.fetchall()}
          assert not remaining, f"PostgreSQL enum types survived downgrade: {sorted(remaining)}"
          PY
          alembic upgrade head
      - name: Smoke-test installed wheel on PostgreSQL
        run: >-
          /tmp/macrovision-wheel/bin/python scripts/release_smoke.py
          --database-url
          postgresql+psycopg://macrovision:macrovision@localhost:5432/macrovision
      - name: PostgreSQL scheduler and analytics constraints
        env:
          MACROVISION_DATABASE_URL: postgresql+psycopg://macrovision:macrovision@localhost:5432/macrovision
          MACROVISION_POSTGRES_TEST_URL: postgresql+psycopg://macrovision:macrovision@localhost:5432/macrovision
        run: >-
          pytest -q tests/test_scheduler_postgresql.py
          tests/test_analytics_postgresql.py
          tests/test_analytics_api_postgresql.py
          tests/test_analytics_benchmark.py
          tests/test_analytics_concurrency.py --no-cov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local backend package
        run: pip install -e .
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Regenerate OpenAPI and typed client
        run: |
          python scripts/export_openapi.py \
            --output web/openapi/macrovision.openapi.json
          npm --prefix web run api:generate
          git diff --exit-code -- \
            web/openapi/macrovision.openapi.json \
            web/src/lib/api/generated/schema.ts
      - name: Frontend OpenAPI drift check
        working-directory: web
        run: npm run api:check
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Frontend TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Frontend tests
        working-directory: web
        run: npm run test:run
      - name: Frontend production build
        working-directory: web
        run: npm run build
      - name: Frontend production smoke
        working-directory: web
        env:
          MACROVISION_BACKEND_URL: http://127.0.0.1:8100
        run: npm run smoke

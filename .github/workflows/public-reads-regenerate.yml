name: Public reads API regeneration

on:
  push:
    branches:
      - feat/public-indicator-reads-v0.8

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/public-indicator-reads-v0.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: web
      - run: |
          python scripts/export_openapi.py --output web/openapi/macrovision.openapi.json
          npm --prefix web run api:generate
      - run: |
          if git diff --quiet -- web/openapi/macrovision.openapi.json web/src/lib/api/generated/schema.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/openapi/macrovision.openapi.json web/src/lib/api/generated/schema.ts
          git commit -m "chore: regenerate public reads API client"
          git push origin HEAD:feat/public-indicator-reads-v0.8

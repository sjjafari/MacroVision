name: Temporary Python formatter

on:
  push:
    branches:
      - feat/content-platform-v0.8

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/content-platform-v0.8
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff format src/macrovision/content_api.py src/macrovision/content_models.py src/macrovision/content_schemas.py src/macrovision/content_services.py tests/test_content_api.py migrations/versions/20261113_0010_content_platform.py migrations/env.py
      - run: ruff check --fix src/macrovision/content_api.py src/macrovision/content_models.py src/macrovision/content_schemas.py src/macrovision/content_services.py tests/test_content_api.py migrations/versions/20261113_0010_content_platform.py migrations/env.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/macrovision/content_api.py src/macrovision/content_models.py src/macrovision/content_schemas.py src/macrovision/content_services.py tests/test_content_api.py migrations/versions/20261113_0010_content_platform.py migrations/env.py
          git commit -m "style: format content platform"
          git push origin HEAD:feat/content-platform-v0.8

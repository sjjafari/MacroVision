name: Phase 4 dependency lock refresh

on:
  push:
    branches:
      - feat/compare-v0.8

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compare-v0.8
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh lockfile
        working-directory: web
        run: npm install --package-lock-only
      - name: Verify production audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Commit lockfile
        run: |
          if git diff --quiet -- web/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: refresh secure frontend lockfile"
          git push origin HEAD:feat/compare-v0.8
